<rect x="0" y="0" width="1860" height="1372" rx="6" fill="#ffffff" stroke="none" stroke-width="1.4"/>
<text x="46" y="54" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">Junior AI Investigator — system architecture</text>
<text x="46" y="84.0" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Organised by trust, not by module: a reproducible decision spine, a bounded reasoning layer that may only propose, a verification boundary between them, and a human who decides.</text>
<text x="1270" y="36" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="start">NOTATION</text>

<text x="1314" y="61" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">deterministic control flow</text>
<path d="M1270,78 L1304,78" stroke="#b45309" stroke-width="2.2" marker-end="url(#aP)"/>
<text x="1314" y="82" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">LLM call — bounded, traced</text>
<path d="M1270,99 L1304,99" stroke="#15803d" stroke-width="2.2" marker-end="url(#aH)"/>
<text x="1314" y="103" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">human action</text>

<text x="1314" y="124" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">feedback — output becomes input</text>

<circle cx="74" cy="176" r="12.5" fill="#1d4ed8"/>
<text x="74" y="180.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="95" y="181" font-size="14.5" font-weight="700" fill="#1d4ed8" text-anchor="start">DETERMINISTIC DECISION SPINE</text>
<text x="343.8" y="181" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">no LLM · reproducible · re-runs on every ingest, rule or outcome change · pinned by 88 tests</text>
<rect x="66" y="200" width="306" height="114" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="79" y="226" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">Ingest + features</text>
<text x="79" y="244.25" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">50 claims, 9 signals each</text>
<text x="79" y="261.938" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">derived: implied travel miles/wk, log-z amount, care-type</text>
<text x="79" y="276.626" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">ratio, claim links</text>
<rect x="402" y="200" width="306" height="114" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="415" y="226" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">Calibration</text>
<text x="415" y="244.25" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">Jenks natural breaks per signal</text>
<text x="415" y="261.938" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">thresholds land in the empty gaps of the real distribution,</text>
<text x="415" y="276.626" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">not on round numbers</text>
<rect x="738" y="200" width="306" height="114" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="751" y="226" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">Rules R01–R17 + custom</text>
<text x="751" y="244.25" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">signal · derived · convergence · silent drift · claim reuse ·</text>
<text x="751" y="258.938" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">fraud lookalike</text>
<text x="751" y="276.626" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">user rules: validated DSL, never executed code</text>
<rect x="1074" y="200" width="306" height="114" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1087" y="226" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">Score → band</text>
<text x="1087" y="244.25" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">strongest rule per domain, combined by noisy-OR</text>
<text x="1087" y="258.938" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">because signals co-move</text>
<text x="1087" y="276.626" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">LOW · MEDIUM · HIGH · CRITICAL</text>
<rect x="1410" y="200" width="306" height="114" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.4"/>
<text x="1423" y="226" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Blocklist — hard rules</text>
<text x="1423" y="244.25" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">claim / provider / member · segment · condition · fraud</text>
<text x="1423" y="258.938" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">history</text>
<text x="1423" y="276.626" font-size="10.8" font-weight="400" fill="#0f172a" text-anchor="start">proposed by investigators, enacted by supervisors</text>

<path d="M713,257.0 L731,257.0" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#aD)"/>

<rect x="66" y="336" width="1150" height="64" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.4"/>
<text x="79" y="362" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">ROUTER — allocates the reasoning budget by difficulty, with no LLM in the loop</text>
<text x="79" y="386" font-size="10.8" font-weight="400" fill="#1d4ed8" text-anchor="start">a case the rules find unambiguous must not cost what an ambiguous one costs</text>
<rect x="1250" y="336" width="324" height="64" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.4"/>
<text x="1263" y="362" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">DECLINED</text>
<text x="1263" y="380.25" font-size="10.2" font-weight="400" fill="#0f172a" text-anchor="start">locked · scoring and AI bypassed · released automatically or by</text>
<text x="1263" y="394.122" font-size="10.2" font-weight="400" fill="#0f172a" text-anchor="start">supervisor override</text>
<path d="M1563.0,317 L1563.0,329" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#aR)"/>
<rect x="46" y="500" width="1768" height="398" rx="12" fill="#fffbef" stroke="#fcd9a0" stroke-width="1.6"/>
<circle cx="74" cy="526" r="12.5" fill="#b45309"/>
<text x="74" y="530.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="95" y="531" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="start">PROBABILISTIC REASONING</text>
<text x="314.0" y="531" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">bounded · traced · may propose, never decide · one harness governs every agent</text>
<rect x="66" y="578" width="320" height="214" rx="8" fill="#ffffff" stroke="#fcd9a0" stroke-width="1.4"/>
<text x="79" y="604" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">FAST — 29 cases</text>
<text x="373" y="603" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="end">58%</text>
<text x="79" y="622.25" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">no rule fired and no linked case</text>
<text x="79" y="639.666" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">one batched call reviews five cases at once; no tools, no</text>
<text x="79" y="654.0820000000001" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">specialists</text>
<text x="79" y="671.4980000000002" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">a note raising concern still forces human review</text>
<text x="79" y="688.9140000000002" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">cheap enough that every clean case keeps an AI second</text>
<text x="79" y="703.3300000000003" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">opinion, which the bulk-clear guardrail requires</text>
<path d="M79,762 L373,762" stroke="#fcd9a0" stroke-width="1"/>
<text x="79" y="781" font-size="9.8" font-weight="700" fill="#b45309" text-anchor="start">0.7 calls · 1.0k tokens · $0.0008 per case</text>
<rect x="402" y="578" width="320" height="214" rx="8" fill="#ffffff" stroke="#fcd9a0" stroke-width="1.4"/>
<text x="415" y="604" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">OBVIOUS — 8 cases</text>
<text x="709" y="603" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="end">16%</text>
<text x="415" y="622.25" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">rule band CRITICAL: the facts are unambiguous</text>
<text x="415" y="639.666" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">verifier alone — specialists would only restate what the rules</text>
<text x="415" y="654.0820000000001" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">already establish</text>
<text x="415" y="671.4980000000002" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">panel convenes only if the verifier&#x27;s own confidence is low</text>
<text x="415" y="688.9140000000002" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">effort goes into explaining the case to a human, not into</text>
<text x="415" y="703.3300000000003" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">re-deciding it</text>
<path d="M415,762 L709,762" stroke="#fcd9a0" stroke-width="1"/>
<text x="415" y="781" font-size="9.8" font-weight="700" fill="#b45309" text-anchor="start">1.0 call · 3.3k tokens · $0.0016 per case</text>
<rect x="738" y="578" width="706" height="214" rx="8" fill="#ffffff" stroke="#fcd9a0" stroke-width="1.4"/>
<text x="751" y="604" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">DEEP — 13 cases · ambiguous, linked, or newly rule-flagged</text>
<text x="1431" y="603" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="end">26%</text>
<path d="M751,762 L1431,762" stroke="#fcd9a0" stroke-width="1"/>
<text x="751" y="781" font-size="9.8" font-weight="700" fill="#b45309" text-anchor="start">4.8 calls · 14k tokens · $0.031 per case   —   reference paid-model prices; the free tier costs $0</text>
<rect x="752" y="620" width="196" height="94" rx="8" fill="#fffbef" stroke="#fcd9a0" stroke-width="1.4"/>
<text x="765" y="644.5" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Specialists (parallel)</text>
<text x="765" y="660.875" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">billing · collusion + linkage · geo/util</text>
<text x="765" y="676.931" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">spawned only where a domain fired; ≤ 1</text>
<text x="765" y="689.9870000000001" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">tool each</text>
<rect x="966" y="620" width="150" height="94" rx="8" fill="#fffbef" stroke="#fcd9a0" stroke-width="1.4"/>
<text x="979" y="644.5" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Challenger</text>
<text x="979" y="660.875" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">argues the benign case,</text>
<text x="979" y="673.931" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">strictly on the evidence</text>
<rect x="1134" y="620" width="150" height="94" rx="8" fill="#fffbef" stroke="#fcd9a0" stroke-width="1.4"/>
<text x="1147" y="644.5" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Verifier</text>
<text x="1147" y="660.875" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">synthesis, self-confidence,</text>
<text x="1147" y="673.931" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">contested flag</text>
<rect x="1302" y="620" width="128" height="94" rx="8" fill="#fffbef" stroke="#fcd9a0" stroke-width="1.4"/>
<text x="1315" y="644.5" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">Panel ×3</text>
<text x="1315" y="660.875" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">conservative · neutral ·</text>
<text x="1315" y="673.931" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">aggressive</text>
<text x="1315" y="689.9870000000001" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">deterministic</text>
<text x="1315" y="703.0430000000001" font-size="9.6" font-weight="400" fill="#0f172a" text-anchor="start">meta-judge</text>
<path d="M952,667 L962,667" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#aP)"/>
<path d="M1120,667 L1130,667" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#aP)"/>
<path d="M1288,667 L1298,667" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#aP)"/>
<text x="1302" y="728" font-size="9.6" font-weight="700" fill="#b45309" text-anchor="start">only if contested</text>
<text x="752" y="742" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">contested = low verifier confidence · challenger finds the benign story strong · specialists disagree · AI band ≠ rule band · score within 5 of a cut</text>
<rect x="66" y="808" width="1378" height="72" rx="8" fill="#fff6e6" stroke="#fcd9a0" stroke-width="1.4"/>
<text x="79" y="833.5" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">HARNESS — the same bounded loop for every agent</text>
<text x="79" y="855" font-size="10.4" font-weight="400" fill="#0f172a" text-anchor="start">budgets (steps · tool calls · tokens · wall-clock) force a final answer   ·   per-agent tool allowlist   ·   typed output with bounded repair   ·   fast→strong escalation   ·   model fallback and circuit breaker   ·   span, token and cost per call</text>
<text x="79" y="870" font-size="10.4" font-weight="700" fill="#b45309" text-anchor="start">fail-closed: when every model fails the case is marked unavailable and the rules-only result stands — nothing is invented to fill the gap</text>
<rect x="1466" y="578" width="328" height="214" rx="8" fill="#ffffff" stroke="#fcd9a0" stroke-width="1.4"/>
<text x="1479" y="603.5" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">Shared capability</text>
<text x="1479" y="621.125" font-size="10.4" font-weight="400" fill="#0f172a" text-anchor="start">9 read-only tools — peer stats, similar and linked cases, notes,</text>
<text x="1479" y="635.269" font-size="10.4" font-weight="400" fill="#0f172a" text-anchor="start">note search, rule catalogue, cluster context</text>
<text x="1479" y="652.413" font-size="10.4" font-weight="400" fill="#0f172a" text-anchor="start">Chatbot over the same tools, at case or queue scope, reading</text>
<text x="1479" y="666.557" font-size="10.4" font-weight="400" fill="#0f172a" text-anchor="start">notes and the audit tail</text>
<text x="1479" y="683.701" font-size="10.4" font-weight="400" fill="#0f172a" text-anchor="start">Assistive: rule drafting from English, briefing narrative, escalation</text>
<text x="1479" y="697.845" font-size="10.4" font-weight="400" fill="#0f172a" text-anchor="start">handoff — each restricted to computed facts</text>
<path d="M226.0,404 L226.0,491" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#aD)"/>
<text x="236.0" y="432" font-size="10.4" font-weight="700" fill="#1d4ed8" text-anchor="start">no rule fired</text>
<path d="M562.0,404 L562.0,491" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#aD)"/>
<text x="572.0" y="432" font-size="10.4" font-weight="700" fill="#1d4ed8" text-anchor="start">CRITICAL</text>
<path d="M1091.0,404 L1091.0,491" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#aD)"/>
<text x="1101.0" y="432" font-size="10.4" font-weight="700" fill="#1d4ed8" text-anchor="start">everything else</text>
<rect x="46" y="922" width="1768" height="108" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1.6"/>
<text x="70" y="954" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="start">VERIFICATION BOUNDARY</text>
<text x="274.475" y="954" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">deterministic — nothing reaches a human unchecked</text>
<text x="70.0" y="982" font-size="11" font-weight="700" fill="#facc15" text-anchor="start">Re-grounded</text>
<text x="70.0" y="998.0" font-size="9.8" font-weight="400" fill="#cbd5e1" text-anchor="start">every cited field and value is re-checked against the record; ungrounded claims are</text>
<text x="70.0" y="1011.132" font-size="9.8" font-weight="400" fill="#cbd5e1" text-anchor="start">dropped and shown</text>
<text x="500.0" y="982" font-size="11" font-weight="700" fill="#facc15" text-anchor="start">Clamped</text>
<text x="500.0" y="998.0" font-size="9.8" font-weight="400" fill="#cbd5e1" text-anchor="start">the model may move the score by ±20; the band is derived from the score, never asserted</text>
<text x="930.0" y="982" font-size="11" font-weight="700" fill="#facc15" text-anchor="start">Refused</text>
<text x="930.0" y="998.0" font-size="9.8" font-weight="400" fill="#cbd5e1" text-anchor="start">no clear where a HIGH/CRITICAL rule or a fraud lookalike fired; no downgrade when a</text>
<text x="930.0" y="1011.132" font-size="9.8" font-weight="400" fill="#cbd5e1" text-anchor="start">linked case is CRITICAL</text>
<text x="1360.0" y="982" font-size="11" font-weight="700" fill="#facc15" text-anchor="start">Attributed</text>
<text x="1360.0" y="998.0" font-size="9.8" font-weight="400" fill="#cbd5e1" text-anchor="start">every figure traced to the evidence; an unverifiable one is flagged rather than published</text>
<rect x="46" y="1086" width="1768" height="212" rx="12" fill="#f2fdf5" stroke="#bbf7d0" stroke-width="1.6"/>
<circle cx="74" cy="1112" r="12.5" fill="#15803d"/>
<text x="74" y="1116.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="95" y="1117" font-size="14.5" font-weight="700" fill="#15803d" text-anchor="start">HUMAN AUTHORITY + SYSTEM OF RECORD</text>
<text x="419.3875" y="1117" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">the AI never changes a case; every decision carries a reason and an actor</text>
<rect x="66" y="1138" width="452" height="134" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.4"/>
<text x="79" y="1164" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">Assessment — a versioned artifact</text>
<text x="79" y="1182.25" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">summary · indicators that each cite a field and value · mitigating factors · band ·</text>
<text x="79" y="1196.666" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">recommended action · confidence</text>
<text x="79" y="1214.0819999999999" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">investigation trace: which agents ran, which tools, what the boundary dropped, tokens and</text>
<text x="79" y="1228.4979999999998" font-size="10.6" font-weight="400" fill="#0f172a" text-anchor="start">cost</text>
<rect x="542" y="1138" width="700" height="134" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.4"/>
<text x="555" y="1164" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">Human decisions</text>
